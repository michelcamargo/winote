name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: https://dlnlcqntbfgxowkywncz.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_dupCh4QRCBGKDrgW_UBr4g_XG0SUtUu
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dupCh4QRCBGKDrgW_UBr4g_XG0SUtUu
      EXPO_PUBLIC_APP_GROUP_ID: group.com.winote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild -p ios --clean
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Build archive
        run: |
          xcrun xcodebuild \
            -workspace ios/winote.xcworkspace \
            -scheme winote \
            -configuration Release \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            archive -archivePath build/winote.xcarchive

      - name: Export IPA
        run: |
          xcrun xcodebuild \
            -exportArchive \
            -archivePath build/winote.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: winote-ios
          path: build/ipa/*.ipa
          if-no-files-found: error
